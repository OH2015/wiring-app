const colors=[['赤','#e54545','red'],['青','#2866dc','blue'],['黄','#f3d84c','yellow'],['緑','#249456','green'],['黒','#272a30','black'],['白','#ffffff','white'],['橙','#f59d31','orange'],['茶','#80502d','brown'],['紫','#8b4ec2','purple'],['桃','#f49ac2','pink'],['灰','#858d99','gray']];const $=id=>document.getElementById(id);let selected='赤',pins=Array(50).fill(''),notes=Array(50).fill('');const key='wiring-color-memo-v1';const storage=()=>JSON.parse(localStorage.getItem(key)||'{}');const addUnusedLine=el=>{const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');svg.setAttribute('class','unused-line');const line=document.createElementNS(ns,'line');line.setAttribute('x1','0');line.setAttribute('y1','100');line.setAttribute('x2','100');line.setAttribute('y2','0');line.setAttribute('stroke','#111');line.setAttribute('stroke-width','2');svg.append(line);el.append(svg)};const normalizeNotes=n=>Array.from({length:50},(_,i)=>typeof n?.[i]==='string'?Array.from(n[i]).slice(0,10).join(''):'');const renderPinContent=(el,val,note)=>{if(val==='未使用')addUnusedLine(el);if(note&&val!=='未使用'){const t=document.createElement('span');t.className='pin-note';t.textContent=note;el.append(t)}if(val&&val!=='未使用'){const t=document.createElement('span');t.className='pin-color-name';t.textContent=val;el.append(t)}};const normalizeNumbering=n=>['horizontal','reverseVertical','reverseHorizontal'].includes(n)?n:'vertical';const normalizePins=p=>Array.from({length:50},(_,i)=>{const r=Math.floor(i/25),c=i%25;return p.length>=50?(p[i]||''):c<16?(p[r*16+c]||''):''});const numberFor=(r,c,cols,rows,mode)=>mode==='reverseHorizontal'?r*cols+cols-c:mode==='reverseVertical'?(cols-1-c)*rows+r+1:rows===1?c+1:mode==='horizontal'?r*cols+c+1:c*2+r+1;const pinNumber=(r,c,cols)=>numberFor(r,c,cols,+$('rows').value,$('numbering').value);function paint(){const cols=+$('col $('groupDelete').onclick=()=>{const g=$('saveGroup').value;if(!g)return alert('保存先グループを選択してください');if(!confirm('グループ「'+g+'」を削除しますか？ 配線パターンは未分類に戻ります。'))return;const all=storage();for(const x of Object.values(all))if(groupOf(x)===g)x.group='';groupWrite(all,groupNames().filter(x=>x!==g))};
$('groupFilter').onchange=refresh;
$('groupMove').onclick=()=>{const n=$('saved').value,all=storage();if(!n||!Object.hasOwn(all,n))return alert('移動する保存済みパターンを選択してください');const g=$('saveGroup').value;if(!confirm('「'+n+'」を「'+(g||'未分類')+'」へ移動しますか？'))return;all[n].group=g;if(groupWrite(all,groupNames())){$('groupFilter').value=allGroup;refresh();$('saved').value=n}};
colors.forEach(([name,hex])=>{const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="background:${hex}"></span>${name}`;b.onclick=()=>{selected=name;document.querySelectorAll('.colors button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};if(name===selected)b.classList.add('active');$('colors').append(b)});const clearButton=document.createElement('button');clearButton.textContent='✕ 取り消し';clearButton.onclick=()=>{selected='';document.querySelectorAll('.colors button').forEach(x=>x.classList.remove('active'));clearButton.classList.add('active')};$('editTools').append(clearButton);const unusedButton=document.createElement('button');unusedButton.textContent='／ 未使用';unusedButton.onclick=()=>{selected='未使用';document.querySelectorAll('.colors button').forEach(x=>x.classList.remove('active'));unusedButton.classList.add('active')};$('editTools').append(unusedButton);const noteButton=document.createElement('button');noteButton.textContent='文字入力';noteButton.onclick=()=>{selected='__note__';document.querySelectorAll('.colors button').forEach(x=>x.classList.remove('active'));noteButton.classList.add('active')};$('editTools').append(noteButton);$('cols').onchange=paint;$('rows').onchange=paint;$('numbering').onchange=paint;$('pattern').oninput=paint;$('save').onclick=()=>{const name=$('pattern').value.trim();if(!name)return alert('パターン名を入力してください');const all=storage();if(all[name]&&!confirm('同じ名前の保存データを上書きしますか？'))return;all[name]={cols:+$('cols').value,rows:+$('rows').value,numbering:$('numbering').value,pins:[...pins],notes:[...notes],group:$('saveGroup').value};try{localStorage.setItem(key,JSON.stringify(all));$('groupFilter').value=allGroup;refresh();$('saved').value=name;alert('保存しました')}catch(e){alert('保存できませんでした')}};$('load').onclick=()=>{const x=storage()[$('saved').value];if(!x)return alert('保存データを選んでください');$('pattern').value=$('saved').value;$('cols').value=String(x.cols);$('rows').value=x.rows===1?'1':'2';$('numbering').value=normalizeNumbering(x.numbering);pins=normalizePins(x.pins);notes=normalizeNotes(x.notes);$('saveGroup').value=groupOf(x);paint()};$('reset').onclick=()=>{if(confirm('現在の入力をすべて消去しますか？')){pins.fill('');notes.fill('');paint()}};$('delete').onclick=()=>{const name=$('saved').value;if(!name)return alert('削除する保存データを選んでください');if(confirm(`「${name}」を削除しますか？`)){const all=storage();delete all[name];localStorage.setItem(key,JSON.stringify(all));refresh()}};function renderPreview(){
 const cols=+$('cols').value, grid=$('previewGrid');
 $('previewTitle').textContent=$('pattern').value.trim();
 grid.classList.toggle('wide-preview',cols===25);grid.style.setProperty('--cols',cols);grid.style.setProperty('--rows',+$('rows').value);grid.style.gridTemplateRows='repeat('+$('rows').value+',minmax(0,1fr))';grid.innerHTML='';
 for(let r=0;r<+$('rows').value;r++){
  const row=document.createElement('div');row.className='preview-row';
  
  for(let c=0;c<cols;c++){
   const val=pins[r*25+c], color=colors.find(x=>x[0]===val);
   const cell=document.createElement('div');cell.className='preview-cell';
   const index=document.createElement('div');index.className='preview-index';index.textContent=pinNumber(r,c,cols);const pin=document.createElement('div');pin.className='preview-pin'+(val==='未使用'?' unused':'');pin.style.background=color?color[1]:'#fff';pin.style.color=!color||['白','黄','橙'].includes(val)?'#111':'#fff';renderPinContent(pin,val,notes[r*25+c]);
   cell.append(index,pin);row.append(cell);
  }
  grid.append(row);
 }
}
$('previewOpen').onclick=()=>{renderPreview();$('previewOverlay').classList.add('open');document.body.classList.add('preview-mode')};
$('previewClose').onclick=()=>{$('previewOverlay').classList.remove('open');document.body.classList.remove('preview-mode')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('previewOverlay').classList.contains('open'))$('previewClose').click()});
$('print').onclick=()=>{
 const data={cols:+$('cols').value,rows:+$('rows').value,numbering:$('numbering').value,pattern:$('pattern').value,pins,notes};
 const encoded=encodeURIComponent(JSON.stringify(data));
 const url=new URL(location.href);url.hash='print='+encoded;
 // A separate browser page lets iOS users access Safari's Share > Print action.
 const opened=window.open(url.href,'_blank');
 if(!opened){alert('印刷画面を開けませんでした。Safariでこのサイトを開いて印刷してください。')}
};
fillGroups('groupFilter',true);$('groupFilter').value=allGroup;fillGroups('batchGroup',true);$('batchGroup').value=allGroup;refresh();paint();
if(location.hash.startsWith('#print=')){
 try{
  const data=JSON.parse(decodeURIComponent(location.hash.slice(7)));
  if(Number.isInteger(data.cols)&&((data.cols>=2&&data.cols<=16)||data.cols===25)&&Array.isArray(data.pins)){
   $('cols').value=String(data.cols);
   $('rows').value=data.rows===1?'1':'2';
   $('numbering').value=normalizeNumbering(data.numbering);
   $('pattern').value=String(data.pattern||'');
   document.body.classList.add('print-page');pins=normalizePins(data.pins);notes=normalizeNotes(data.notes);
   paint();
   document.querySelector('.app').insertAdjacentHTML('afterbegin','<section class="panel no-print" id="printHelp"><strong>印刷用画面</strong><p class="hint">iPhoneではSafariの共有ボタンから「プリント」を選択してください。印刷ダイアログが開かない場合も、この画面をスクリーンショットして印刷できます。</p><button id="tryPrint" class="primary">印刷ダイアログを開く</button></section>');
   $('tryPrint').onclick=()=>window.print();
  }
 }catch(e){console.warn('印刷データを読み込めませんでした',e)}
}


function makeBatchItem(data){
 const cols=Number(data.cols),rows=data.rows===1?1:2,numbering=normalizeNumbering(data.numbering),batchPins=normalizePins(data.pins),batchNotes=normalizeNotes(data.notes);
 const item=document.createElement('section');item.className='batch-item';
 const title=document.createElement('h3');title.textContent=String(data.pattern||'').trim();item.append(title);
 const grid=document.createElement('div');grid.className='batch-grid';
 grid.style.gridTemplateColumns='repeat('+cols+', minmax(0, 1fr))';
 grid.style.width='min(100%, '+(cols*37)+'px)';
 for(let row=0;row<rows;row++){
  
  for(let col=0;col<cols;col++){
   const val=batchPins[row*25+col]||'';
   const color=colors.find(x=>x[0]===val);
   const cell=document.createElement('div');cell.className='batch-cell';
   const number=document.createElement('div');number.className='batch-number';number.textContent=numberFor(row,col,cols,rows,numbering);
   const pin=document.createElement('div');pin.className='batch-pin'+(val==='未使用'?' unused':'');
   pin.style.background=color?color[1]:'#fff';
   pin.style.color=!color||['白','黄','橙'].includes(val)?'#111':'#fff';
   renderPinContent(pin,val,batchNotes[row*25+col]);
   cell.append(number,pin);grid.append(cell);
  }
 }
 item.append(grid);return item;
}
function showBatchSheet(patterns){
 document.body.classList.add('batch-mode');
 const sheet=$('batchSheet');sheet.hidden=false;sheet.innerHTML='';
 const help=document.createElement('section');help.className='panel no-print';
 help.innerHTML='<strong>複数パターンの印刷用画面</strong><p class="hint">Safariの共有メニューから「プリント」を選んでください。印刷時にはこの案内は表示されません。</p><button id="batchPrintNow" class="primary">印刷ダイアログを開く</button> <button id="batchReturn">編集に戻る</button>';
 sheet.append(help);
 for(const pattern of patterns)sheet.append(makeBatchItem(pattern));
 $('batchPrintNow').onclick=()=>window.print();
 $('batchReturn').onclick=()=>{document.body.classList.remove('batch-mode');sheet.hidden=true;history.replaceState(null,'',location.pathname+location.search)};
}
function updateBatchRanks(){const rows=[...$('batchChoices').querySelectorAll('.batch-choice-row')];let rank=0;rows.forEach((row,i)=>{row.querySelector('.batch-rank').textContent=row.querySelector('input').checked?String(++rank)+'.':'–';row.querySelector('.batch-up').disabled=i===0;row.querySelector('.batch-down').disabled=i===rows.length-1})}
$('batchOpen').onclick=()=>{
 const all=storage(),names=Object.keys(all).sort().filter(n=>matchesGroup(all[n],$('batchGroup').value)),choices=$('batchChoices');
 choices.innerHTML='';
 if(!names.length){choices.textContent='このグループには保存済みパターンがありません。'}
 for(const name of names){
  const label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.value=name;cb.checked=true;
  const row=document.createElement('div');row.className='batch-choice-row';
  const rank=document.createElement('span');rank.className='batch-rank';
  const title=document.createElement('span');title.className='batch-choice-name';title.textContent=name;
  label.append(cb,rank,title);row.append(label);
  for(const direction of [-1,1]){
   const button=document.createElement('button');button.type='button';button.textContent=direction===-1?'↑':'↓';button.className=direction===-1?'batch-up':'batch-down';button.setAttribute('aria-label',name+(direction===-1?'を上へ移動':'を下へ移動'));
   button.onclick=()=>{const neighbor=direction===-1?row.previousElementSibling:row.nextElementSibling;if(!neighbor)return;if(direction===-1)choices.insertBefore(row,neighbor);else choices.insertBefore(neighbor,row);updateBatchRanks();row.scrollIntoView({block:'nearest'})};row.append(button);
  }
  cb.onchange=updateBatchRanks;choices.append(row);
 }
 updateBatchRanks();$('batchPanel').hidden=false;
 $('batchPanel').scrollIntoView({behavior:'smooth',block:'start'});
};
$('batchGroup').onchange=()=>$('batchOpen').click();$('batchClose').onclick=()=>{$('batchPanel').hidden=true};
$('batchSelectAll').onclick=()=>{document.querySelectorAll('#batchChoices input').forEach(x=>x.checked=true);updateBatchRanks()};
$('batchPreview').onclick=()=>{
 const all=storage(),names=[...document.querySelectorAll('#batchChoices input:checked')].map(x=>x.value);
 if(!names.length){alert('印刷するパターンを選択してください');return}
 const patterns=names.map(name=>({...all[name],pattern:name}));
 const url=new URL(location.href);url.hash='batch='+encodeURIComponent(JSON.stringify(patterns));
 const opened=window.open(url.href,'_blank');
 if(!opened){showBatchSheet(patterns);alert('別画面を開けなかったため、この画面に印刷用一覧を表示しました。Safariの共有メニューから印刷してください。')}
};
if(location.hash.startsWith('#batch=')){
 try{
  const patterns=JSON.parse(decodeURIComponent(location.hash.slice(7)));
  if(Array.isArray(patterns)&&patterns.length&&patterns.length<=100&&patterns.every(x=>Number.isInteger(x.cols)&&((x.cols>=2&&x.cols<=16)||x.cols===25)&&Array.isArray(x.pins)))showBatchSheet(patterns);
 }catch(e){console.warn('複数印刷データを読み込めませんでした',e)}
}

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('オフライン登録に失敗:',err))); }
</script></body></html>
