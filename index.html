<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配線カラーメモ</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#2457c5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="配線メモ"><link rel="apple-touch-icon" href="./icons/icon-192.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202632;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}.app{max-width:920px;margin:auto;padding:16px}h1{font-size:1.45rem;margin:8px 0 16px}.panel{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}.toolbar,.colors,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}button,select,input{border:1px solid #bfc7d2;border-radius:9px;padding:10px;background:white}button{cursor:pointer}button.primary{background:#2457c5;color:white;border-color:#2457c5}.colors button{display:flex;align-items:center;gap:6px;padding:8px}.colors button.active{outline:3px solid #2457c5}.swatch{width:22px;height:22px;border:1px solid #666;border-radius:50%;display:inline-block}.grid-scroll{overflow-x:auto;padding:12px 0}.pin-grid{display:grid;gap:5px;min-width:max-content}.pin{width:48px;height:48px;border:2px solid #4c5564;border-radius:6px;font-weight:700;cursor:pointer}.pin.white,.pin.yellow{color:#111}.pin:not(.white):not(.yellow):not(.orange){color:white}.pin.orange{color:#111}.pin-label{font-size:12px;text-align:center;color:#555}.pin-cell{display:flex;flex-direction:column;align-items:center;gap:4px}.pin-number{font-size:13px;font-weight:800;color:#202632;line-height:1.2;font-variant-numeric:tabular-nums}.row-label{display:flex;align-items:center;justify-content:center;font-weight:700}.hint{color:#606a78;font-size:.88rem}.name{width:min(100%,310px)}@media print{body{background:white}.app{max-width:none;padding:0}h1{display:none}.panel{box-shadow:none;border:0;margin:0;padding:5px}.no-print{display:none!important}.pin{print-color-adjust:exact;-webkit-print-color-adjust:exact}.grid-scroll{overflow:visible}.pin-grid{gap:4px}.pin{width:42px;height:42px}.pin-number{font-size:12px}#printTitle{font-size:20px!important}}@media(max-width:600px){.pin{width:39px;height:42px}.app{padding:10px}.panel{padding:12px}}

/* Screenshot preview: fixed viewport, no horizontal scrolling */
.preview-overlay{position:fixed;inset:0;z-index:1000;background:#fff;display:none;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));overflow:hidden}
.preview-overlay.open{display:flex}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.preview-title{font-size:clamp(13px,3vw,22px);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-close{font-size:14px;padding:7px 12px;flex-shrink:0}
.preview-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.preview-grid{display:grid;width:100%;grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(4px,1.4vh,14px);max-height:min(72vh,420px)}
.preview-row{display:grid;grid-template-columns:22px repeat(var(--cols),minmax(0,1fr));gap:clamp(2px,.5vw,8px);min-width:0;align-items:stretch}
.preview-row-label{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(10px,2vw,17px)}
.preview-cell{min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.preview-pin{width:100%;aspect-ratio:1;max-height:min(27vh,140px);border:1.5px solid #4c5564;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,1.8vw,22px);font-weight:800;overflow:hidden}
.preview-index{font-size:clamp(9px,1.9vw,16px);color:#222;font-weight:800;line-height:1.1}
.preview-tip{font-size:11px;text-align:center;color:#666;margin:6px 0 0}
body.preview-mode{overflow:hidden}
@media (orientation:portrait){.preview-grid{max-height:55vh}.preview-pin{font-size:clamp(7px,2vw,15px)}.preview-row{grid-template-columns:18px repeat(var(--cols),minmax(0,1fr));gap:2px}.preview-index{font-size:9px}}
@media print{.preview-overlay{display:none!important}}
</style></head><body><main class="app"><h1>配線カラーメモ</h1><section class="panel no-print"><div class="toolbar"><label>横の列数 <select id="cols"><option value="2">2列</option><option value="3">3列</option><option value="4">4列</option><option value="5">5列</option><option value="6">6列</option><option value="7">7列</option><option value="8" selected>8列</option><option value="9">9列</option><option value="10">10列</option><option value="11">11列</option><option value="12">12列</option><option value="13">13列</option><option value="14">14列</option><option value="15">15列</option><option value="16">16列</option></select></label><label>番号の振り方 <select id="numbering"><option value="vertical">縦方向（上段1,3,5…）</option><option value="horizontal">横方向（上段1,2,3…）</option></select></label><label>パターン名 <input id="pattern" class="name" placeholder="例：品番 A-001"></label></div><p class="hint">色を選び、ピンをタップしてください。配線図の向きに合わせて上段・下段を確認してください。</p><div class="colors" id="colors"></div></section><section class="panel"><h2 id="printTitle" style="font-size:1.15rem;margin:0 0 12px">配線表</h2><div class="grid-scroll"><div id="grid" class="pin-grid"></div></div><p class="hint no-print">横16列は左右にスクロールできます。</p></section><section class="panel no-print"><div class="actions"><button class="primary" id="save">この端末に保存</button><select id="saved"><option value="">保存済みを選択</option></select><button id="load">呼び出す</button><button class="primary" id="previewOpen">全画面プレビュー</button><button id="print">印刷</button><button id="reset">全消去</button><button id="delete">保存データ削除</button></div><p class="hint">保存先はこのブラウザ内です。別の端末とは同期されません。印刷はスマホの印刷機能から行います。</p></section></main><div id="previewOverlay" class="preview-overlay" role="dialog" aria-modal="true" aria-label="配線表の全画面プレビュー"><div class="preview-head"><div id="previewTitle" class="preview-title"></div><button id="previewClose" class="preview-close">編集に戻る</button></div><div class="preview-body"><div id="previewGrid" class="preview-grid"></div></div><div class="preview-tip">スクリーンショットを撮って保存できます。横向き表示がおすすめです。</div></div><script>
const colors=[['赤','#e54545','red'],['青','#2866dc','blue'],['黄','#f3d84c','yellow'],['緑','#249456','green'],['黒','#272a30','black'],['白','#ffffff','white'],['橙','#f59d31','orange'],['茶','#80502d','brown'],['紫','#8b4ec2','purple'],['灰','#858d99','gray']];const $=id=>document.getElementById(id);let selected='赤',pins=Array(32).fill('');const key='wiring-color-memo-v1';const storage=()=>JSON.parse(localStorage.getItem(key)||'{}');const pinNumber=(r,c,cols)=>$('numbering').value==='horizontal'?r*cols+c+1:c*2+r+1;function paint(){const cols=+$('cols').value;const g=$('grid');g.style.gridTemplateColumns=`30px repeat(${cols},minmax(39px,48px))`;g.innerHTML='';for(let r=0;r<2;r++){const lab=document.createElement('div');lab.className='row-label';lab.textContent=r?'下':'上';g.append(lab);for(let c=0;c<cols;c++){const idx=r*16+c;const color=colors.find(x=>x[0]===pins[idx]);const cell=document.createElement('div');cell.className='pin-cell';const number=document.createElement('div');number.className='pin-number';number.textContent=pinNumber(r,c,cols);const b=document.createElement('button');b.className='pin '+(color?color[2]:'white');b.style.background=color?color[1]:'#fff';b.textContent=pins[idx]||'＋';b.setAttribute('aria-label',`${r?'下':'上'}段${c+1}列 ${pins[idx]||'未設定'}`);b.onclick=()=>{pins[idx]=selected;paint()};cell.append(number,b);g.append(cell)}}$('printTitle').textContent=($('pattern').value.trim()||'配線表')+'（'+cols+'列 × 2段）'}function refresh(){const s=$('saved');s.innerHTML='<option value="">保存済みを選択</option>';Object.keys(storage()).sort().forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;s.append(o)})}colors.forEach(([name,hex])=>{const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="background:${hex}"></span>${name}`;b.onclick=()=>{selected=name;document.querySelectorAll('.colors button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};if(name===selected)b.classList.add('active');$('colors').append(b)});$('cols').onchange=paint;$('numbering').onchange=paint;$('pattern').oninput=paint;$('save').onclick=()=>{const name=$('pattern').value.trim();if(!name)return alert('パターン名を入力してください');const all=storage();if(all[name]&&!confirm('同じ名前の保存データを上書きしますか？'))return;all[name]={cols:+$('cols').value,numbering:$('numbering').value,pins:[...pins]};try{localStorage.setItem(key,JSON.stringify(all));refresh();$('saved').value=name;alert('保存しました')}catch(e){alert('保存できませんでした')}};$('load').onclick=()=>{const x=storage()[$('saved').value];if(!x)return alert('保存データを選んでください');$('pattern').value=$('saved').value;$('cols').value=String(x.cols);$('numbering').value=x.numbering==='horizontal'?'horizontal':'vertical';pins=Array.from({length:32},(_,i)=>x.pins[i]||'');paint()};$('reset').onclick=()=>{if(confirm('現在の入力をすべて消去しますか？')){pins.fill('');paint()}};$('delete').onclick=()=>{const name=$('saved').value;if(!name)return alert('削除する保存データを選んでください');if(confirm(`「${name}」を削除しますか？`)){const all=storage();delete all[name];localStorage.setItem(key,JSON.stringify(all));refresh()}};function renderPreview(){
 const cols=+$('cols').value, grid=$('previewGrid');
 $('previewTitle').textContent=($('pattern').value.trim()||'配線表')+`（${cols}列 × 2段）`;
 grid.style.setProperty('--cols',cols);grid.innerHTML='';
 for(let r=0;r<2;r++){
  const row=document.createElement('div');row.className='preview-row';
  const label=document.createElement('div');label.className='preview-row-label';label.textContent=r?'下':'上';row.append(label);
  for(let c=0;c<cols;c++){
   const val=pins[r*16+c], color=colors.find(x=>x[0]===val);
   const cell=document.createElement('div');cell.className='preview-cell';
   const index=document.createElement('div');index.className='preview-index';index.textContent=pinNumber(r,c,cols);const pin=document.createElement('div');pin.className='preview-pin';pin.style.background=color?color[1]:'#fff';pin.style.color=!color||['白','黄','橙'].includes(val)?'#111':'#fff';pin.textContent=val||'－';
   cell.append(index,pin);row.append(cell);
  }
  grid.append(row);
 }
}
$('previewOpen').onclick=()=>{renderPreview();$('previewOverlay').classList.add('open');document.body.classList.add('preview-mode')};
$('previewClose').onclick=()=>{$('previewOverlay').classList.remove('open');document.body.classList.remove('preview-mode')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('previewOverlay').classList.contains('open'))$('previewClose').click()});
$('print').onclick=()=>window.print();refresh();paint();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('オフライン登録に失敗:',err))); }
</script></body></html>
